<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SD26 Block by Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b4b;--orange:#f47920;--bg:#f8f7f4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:560px;width:100%;background:#fff;border:2px solid var(--navy);border-radius:16px;padding:40px 32px;text-align:center}
h1{font-size:2rem;margin-bottom:8px}
.mono{font-family:'DM Mono',monospace;color:var(--orange);font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:.85rem;margin-bottom:20px}
p{line-height:1.55;font-size:1.02rem}
.bar{height:6px;width:88px;background:var(--orange);border-radius:3px;margin:22px auto 0}
</style>
</head>
<body>
<div class="card">
<h1>SD26 Block by Block</h1>
<div class="mono">New York State Senate District 26</div>
<p>Block-level civic data for Senate District 26 is being built. Check back soon.</p>
<div class="bar"></div>
</div>
</body>
</html>
