<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>All block cards &mdash; My SD26 Block</title>
<meta name="description" content="Every block card in New York State Senate District 26, listed by street.">
<meta property="og:site_name" content="My SD26 Block">
<meta property="og:title" content="All block cards, State Senate District 26">
<meta property="og:url" content="https://sd26block.app/block/">
<meta property="og:image" content="https://sd26block.app/sd26-logo.png">
<link rel="icon" href="/sd26-logo.png">
<link rel="stylesheet" href="/assets/cd-page.css">
<link rel="stylesheet" href="/assets/sd26-theme.css">
<script async src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "b6e9b47ba0cf416388d72db8edaf4198"}'></script>
<style>
body{background:var(--off)}
.wrap{max-width:820px;margin:0 auto;background:#fff;min-height:100vh}
.top{padding:20px 18px 16px;border-bottom:3px solid var(--navy)}
.crumb{font-family:'DM Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-bottom:9px}
.crumb a{color:var(--navy);text-decoration:none}
.top h1{font-family:'DM Sans',sans-serif;font-size:1.5rem;font-weight:800;color:var(--navy);margin:0}
.top .sub{font-family:'DM Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-top:6px}
.srch{padding:13px 16px;background:var(--navy);position:sticky;top:0;z-index:5}
.srch input{width:100%;padding:12px 13px;font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:600;border:none;border-radius:10px;color:var(--navy)}
.list{padding:0 0 30px}
.st{padding:11px 16px 7px;font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:800;color:var(--navy);background:var(--off);border-top:1px solid var(--border);border-bottom:1px solid var(--border);position:sticky;top:62px}
.bk{display:block;padding:11px 16px;border-bottom:1px solid var(--border);text-decoration:none;color:#222;font-size:.88rem}
.bk:hover{background:#f2f5fd}
.bk b{color:var(--navy);font-weight:700}
.more{display:block;width:calc(100% - 32px);margin:16px;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.86rem;font-weight:700;cursor:pointer}
.cnt{padding:10px 16px;font-family:'DM Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
  <div class="crumb"><a href="/">My SD26 Block</a> &rsaquo; Block cards</div>
  <h1>All block cards</h1>
  <div class="sub">New York State Senate District 26</div>
</div>
<div class="srch"><input id="q" type="search" placeholder="Search a street or cross street" autocomplete="off"></div>
<div class="cnt" id="cnt">Loading&hellip;</div>
<div class="list" id="list"></div>
</div>
<script>
(function(){
'use strict';
var IDX=[],shown=0,filtered=[],PAGE=300;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var list=document.getElementById('list'),cnt=document.getElementById('cnt');

function draw(reset){
  if(reset){list.innerHTML='';shown=0;}
  var end=Math.min(shown+PAGE,filtered.length),h='',lastSt=shown>0?filtered[shown-1].st:null;
  for(var i=shown;i<end;i++){
    var r=filtered[i];
    if(r.st!==lastSt){h+='<div class="st">'+esc(r.st)+'</div>';lastSt=r.st;}
    h+='<a class="bk" href="/block/'+esc(r.slug)+'/">between <b>'+esc(r.from)+'</b> and <b>'+esc(r.to)+'</b></a>';
  }
  var btn=list.querySelector('.more');if(btn)btn.remove();
  list.insertAdjacentHTML('beforeend',h);
  shown=end;
  if(shown<filtered.length){
    var b=document.createElement('button');
    b.className='more';b.type='button';
    b.textContent='Show more ('+(filtered.length-shown).toLocaleString()+' left)';
    b.addEventListener('click',function(){draw(false);});
    list.appendChild(b);
  }
  cnt.textContent=filtered.length.toLocaleString()+' block'+(filtered.length===1?'':'s');
}

fetch('/data/sd26-index.json').then(function(r){return r.json();}).then(function(j){
  IDX=j;filtered=j;draw(true);
});

var t=null;
document.getElementById('q').addEventListener('input',function(e){
  clearTimeout(t);
  var q=e.target.value.trim().toLowerCase();
  t=setTimeout(function(){
    filtered=q?IDX.filter(function(r){return r.title.toLowerCase().indexOf(q)>=0;}):IDX;
    draw(true);
  },160);
});
})();
</script>
</body>
</html>
